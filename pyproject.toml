[project]
name = "docscan-api"
version = "0.1.0"
description = "Asynchronous document scanning and OCR API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "redis>=5.2.1,<5.3",
  "rq>=2.1,<3.0",
  "opencv-python-headless>=4.10.0.84,<4.11",
  "numpy>=2.1,<3.0",
  "pytesseract>=0.3.13,<1.0",
  "Pillow>=13.0,<14.0",
  "boto3>=1.35,<2.0",
  "httpcore>=1.0,<2.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "deploy*", "artifacts*"]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1.0",
  "mypy>=1.14.1,<1.15",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "fakeredis[lua]>=2.26,<3.0",
  "types-requests>=2.32,<3.0",
  "boto3-stubs[s3]>=1.35,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = [".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = ["cv2", "pytesseract", "rq.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app.domain --cov=app.pipeline.scanner --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
