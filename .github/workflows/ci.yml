name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install system OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Install project
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps -e .
      - name: Run checks
        run: make check
      - name: Verify exported contract is current
        run: python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json

  image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.spaces
          platforms: linux/amd64
          push: false
          load: true
          tags: docscan-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test local demo image
        run: bash scripts/smoke-image.sh docscan-api:ci 7860
