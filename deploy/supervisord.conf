[supervisord]
nodaemon=true
user=root

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes
priority=10
autostart=true
autorestart=true

[program:worker]
command=python -m app.worker
directory=/app
priority=20
autostart=true
autorestart=true

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860
directory=/app
priority=30
autostart=true
autorestart=true
