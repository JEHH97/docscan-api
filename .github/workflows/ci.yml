name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install system OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Install project
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps -e .
      - name: Run checks
        run: make check
      - name: Verify exported contract is current
        run: python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json
